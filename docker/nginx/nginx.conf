events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    # Rate limiting — protect the AI endpoint
    limit_req_zone $binary_remote_addr zone=query:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/m;

    server {
        listen 80;
        server_name _;

        # The UI has no inline script/style and can use a strict CSP.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; connect-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # ── Health check (no rate limit) ────────────────────────────────
        location /health {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /translate/status {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        # ── API docs (Swagger UI) ────────────────────────────────────────
        location /docs {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        # ── Query endpoint (rate limited) ────────────────────────────────
        location /query {
            limit_req zone=query burst=5 nodelay;
            limit_req zone=global burst=20 nodelay;

            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;   # LLM generation can be slow on CPU
            proxy_send_timeout 180s;
        }

        # ── Static frontend (chat.html served directly) ──────────────────
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            limit_except GET HEAD { deny all; }
        }
    }
}
