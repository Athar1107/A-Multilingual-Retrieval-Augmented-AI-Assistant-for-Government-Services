events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Rate limiting — protect the AI endpoint
    limit_req_zone $binary_remote_addr zone=query:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/m;

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ── Health check (no rate limit) ────────────────────────────────
        location /health {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        location /translate/status {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        # ── API docs (Swagger UI) ────────────────────────────────────────
        location /docs {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        # ── Query endpoint (rate limited) ────────────────────────────────
        location /query {
            limit_req zone=query burst=5 nodelay;
            limit_req zone=global burst=20 nodelay;

            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 180s;   # LLM generation can be slow on CPU
            proxy_send_timeout 180s;
        }

        # ── Static frontend (chat.html served directly) ──────────────────
        location / {
            proxy_pass         http://backend:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
