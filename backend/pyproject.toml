[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app"]

[project]
name = "seva-ai-backend"
version = "0.1.0"
description = "Backend for Seva AI — multilingual RAG system for Indian government services"
requires-python = ">=3.11"

dependencies = [
    # Web Framework
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    "httpx==0.27.0",

    # Data Validation & Settings
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",

    # Vector Store
    "chromadb==0.5.3",

    # Embeddings & Translation
    "sentence-transformers==3.0.1",
    "torch>=2.3.1",
    "transformers==4.43.3",
    "sentencepiece==0.2.0",

    # Document Processing
    "pymupdf==1.24.9",
    "beautifulsoup4==4.12.3",
    "lxml==5.2.2",

    # Text Retrieval & Search
    "rank-bm25==0.2.2",
    "tiktoken==0.7.0",

    # Structured Logging
    "structlog==24.2.0",

    # Utilities
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "chardet==5.2.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.27.0",
    "anyio==4.4.0",

    # Code Quality
    "ruff==0.5.4",
    "black==24.4.2",
    "mypy==1.11.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.per-file-ignores]
"tests/**" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "rag_eval: marks tests as RAG evaluation tests (slow, requires real LLM)",
    "integration: marks tests as integration tests (requires running services)",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
