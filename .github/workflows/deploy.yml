name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm production deployment"
        required: true

jobs:
  guard:
    name: Deployment Guard
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "Deployment not confirmed. Aborting."
            exit 1
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: guard
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        # Replace with your actual deployment steps:
        # e.g., SSH + docker compose pull + docker compose up -d
        run: echo "Deployment step — configure for your infrastructure"

      - name: Verify deployment health
        run: |
          echo "Smoke test — configure with production URL"
          # curl -f https://your-domain.gov.in/api/v1/health/live
