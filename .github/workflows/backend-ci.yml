name: Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "frontend/**"

jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install \
            httpx \
            fastapi \
            pydantic \
            pydantic-settings \
            pytest \
            pytest-asyncio \
            sentencepiece \
            structlog
        working-directory: backend

      - name: Run tests
        run: |
          pytest tests/test_ingestion.py \
                 tests/test_pipeline.py \
                 tests/test_fallback_routing.py \
                 tests/test_api_security.py \
                 tests/test_translation_hints.py \
                 tests/test_user_and_admin.py \
                 tests/test_admin_ops.py \
                 -v --tb=short
        working-directory: backend
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          ADMIN_API_KEY: "admin@1234"
          ADMIN_USERNAME: "Atharv"
          QUERY_LOG_DB_PATH: "data/query_log.db"

  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend smoke test
        run: npm test
