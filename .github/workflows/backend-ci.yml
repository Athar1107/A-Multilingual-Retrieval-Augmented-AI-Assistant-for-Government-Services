name: Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"

jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install httpx fastapi pydantic pydantic-settings uvicorn \
                      pytest pytest-asyncio \
                      rank-bm25 sentencepiece
        working-directory: backend

      # sentence-transformers pulls torch which is large — install separately
      - name: Install ML dependencies
        run: pip install sentence-transformers chromadb
        working-directory: backend

      - name: Run tests (no coverage gate yet)
        run: |
          pytest tests/test_ingestion.py \
                 tests/test_pipeline.py \
                 tests/test_fallback_routing.py \
                 -v --no-header --tb=short
        working-directory: backend
        env:
          APP_ENV: test
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
