# Government AI Assistant — Docker Compose
# Run from the project root:
#   docker compose up
#
# First-time setup:
#   docker compose up -d
#   docker exec gov-ollama ollama pull llama3.2
#   docker compose exec backend python scripts/run_ingestion.py
#   docker compose exec backend python -m app.rag.indexing
#   docker compose exec backend python scripts/ingest_pdf_sources.py

networks:
  internal:       # backend ↔ chromadb ↔ ollama (not exposed to browser)
    driver: bridge
  proxy:          # nginx ↔ backend ↔ frontend (browser-facing)
    driver: bridge

volumes:
  chroma_data:    # ChromaDB vector index persistence
  ollama_data:    # Ollama model weights persistence

services:

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    container_name: gov-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - proxy
    restart: unless-stopped

  # ── Backend (FastAPI + Uvicorn) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gov-backend
    env_file:
      - ./backend/.env.example      # copy to backend/.env and fill in values
    environment:
      - APP_ENV=production
      - ALLOWED_ORIGINS=
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - CHROMA_INDEX_PATH=/app/data/indexes/chroma
      - PROCESSED_CORPUS_PATH=/app/data/processed/active_english.json
      - HF_HUB_OFFLINE=0
      - TRANSLATION_MODEL=auto
    volumes:
      - ./data:/app/data            # corpus, indexes, and processed files
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - internal
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── ChromaDB (Vector Store) ────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: gov-chromadb
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Ollama (LLM) ──────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: gov-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal
    restart: unless-stopped
    # GPU support (uncomment if you have NVIDIA GPU):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
